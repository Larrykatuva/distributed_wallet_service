# Cache only: no persistence, LRU eviction. Losing it costs a few cache misses.
apiVersion: v1
kind: Service
metadata:
  name: wallet-redis
  namespace: wallet
  labels:
    app.kubernetes.io/name: wallet-redis
spec:
  selector:
    app.kubernetes.io/name: wallet-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-redis
  namespace: wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru", "--tcp-backlog", "4096"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1280Mi
            limits:
              cpu: "1"
              memory: 1280Mi
