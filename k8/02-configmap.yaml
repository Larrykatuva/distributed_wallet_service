# Non-secret configuration consumed by config.Load() (config/config.go).
# ADVERTISED_HOST and K8S_NAMESPACE are deliberately NOT set here: the
# Deployment injects them via the Downward API so they always match the
# pod's actual IP and namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  namespace: wallet
data:
  PORT: "3003"
  GRPC_PORT: "3004"
  CORS_ALLOWED_ORIGINS: "https://*.example.com"
  SHUTDOWN_TIMEOUT: "20s"
  LOG_TO_FILE: "false"            # stdout only; the platform collects logs

  # Actor cluster: multi-node via the Proto.Actor Kubernetes provider.
  CLUSTER_MODE: "cluster"
  CLUSTER_NAME: "wallet-cluster"
  CLUSTER_PORT: "8090"

  # Database: the application pool goes through PgBouncer; migrations go
  # direct to Postgres (advisory locks need a real session).
  DB_HOST: "wallet-postgres.wallet.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "wallet_database"
  DB_USER: "postgres"
  DB_SSLMODE: "disable"
  USE_PGBOUNCER: "true"
  PGBOUNCER_HOST: "wallet-pgbouncer.wallet.svc.cluster.local"
  PGBOUNCER_PORT: "6432"
  PGBOUNCER_POOL_MODE: "transaction"

  # Cache
  REDIS_ADDR: "wallet-redis.wallet.svc.cluster.local:6379"
  REDIS_DB: "0"
  CACHE_TTL: "5m"

  # Recovery
  TRANSACTION_TIMEOUT: "30s"
  RECOVERY_STALE_AFTER: "2m"
  RECOVERY_SWEEP_INTERVAL: "30s"
  RECOVERY_MAX_ATTEMPTS: "5"
---
# Mounted into the postgres container at /docker-entrypoint-initdb.d so it runs
# once on first startup (harmless on Postgres >= 13 where gen_random_uuid is built in).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-postgres-init
  namespace: wallet
data:
  00-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
