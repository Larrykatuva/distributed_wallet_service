# Self-contained Postgres for dev/staging clusters.
#
# For production at 10k requests/second use a managed, HA Postgres (or an
# operator such as CloudNativePG) sized around 16+ vCPU with NVMe storage,
# and point DB_HOST at it. The application tier scales horizontally; the
# database is the ceiling, and every transaction leg is at least two writes.
apiVersion: v1
kind: Service
metadata:
  name: wallet-postgres
  namespace: wallet
  labels:
    app.kubernetes.io/name: wallet-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wallet-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wallet-postgres
  namespace: wallet
spec:
  serviceName: wallet-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Sized for the PgBouncer pools below (2 x 100 server connections)
          # plus migrations and admin sessions.
          args:
            - postgres
            - -c
            - max_connections=300
            - -c
            - shared_buffers=1GB
            - -c
            - effective_cache_size=3GB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=256MB
            - -c
            - wal_buffers=64MB
            - -c
            - max_wal_size=4GB
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - random_page_cost=1.1
            - -c
            - effective_io_concurrency=200
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: init-scripts
          configMap:
            name: wallet-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
