# PLACEHOLDER — do not commit real credentials.
# Override in production via `kubectl create secret generic wallet-secrets
# --namespace wallet --from-literal=DB_PASSWORD=... --dry-run=client -o yaml`,
# a sealed-secrets/external-secrets pipeline, or the kustomization secretGenerator.
apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: wallet
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
  POSTGRES_PASSWORD: "change-me"
